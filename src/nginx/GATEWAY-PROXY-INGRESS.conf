# ========================================================================
# IGI Core Specification: Hardened Ingress Proxy Gateway Configuration
# Reference: Section 3.2 Hardened Ingress Proxy Gateway Configurations
# ========================================================================

# 1. Define Leaky-Bucket Rate Limiting Zones
# Allocates maximum connection capacity of 10 requests per second
limit_req_zone $binary_remote_addr zone=iweoid_global_limit:10m rate=10r/s;

# Sets a hard constraint of 2 requests per second for metrics monitoring
limit_req_zone $binary_remote_addr zone=iweoid_metrics_limit:10m rate=2r/s;

# 2. Main Server Block Configuration
server {
    listen 443 ssl http2;
    server_name api.iweology.io ://iweo-global.com;

    # Isolate internal database environments from public security vectors
    location / {
        proxy_pass http://localhost:8080; # Directs to internal application bus
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enforce iweoid_global_limit: 10 r/s baseline with a burst buffer allowance of 15
        limit_req zone=iweoid_global_limit burst=15 nodelay;
        limit_req_status 429;
    }

    # Protected Telemetry and Metrics Exporter Endpoints
    location /metrics {
        proxy_pass http://localhost:9090; # Directs to Prometheus telemetry instance
        
        # Enforce iweoid_metrics_limit: 2 r/s baseline with a maximum burst capacity of 3
        limit_req zone=iweoid_metrics_limit burst=3 nodelay;
        limit_req_status 429;
        
        allow 127.0.0.1;
        allow 10.0.0.0/8; # Restrict metrics visibility to internal secure networks
        deny all;
    }

    # Automated Intrusion Dropping Custom Error Configuration
    error_page 429 /err429.html;
    location = /err429.html {
        root /usr/share/nginx/html;
        internal;
        # Instantly blocked with an HTTP 429 Too Many Requests status code payload within 3ms
        add_header Retry-After 60;
        return 429 '{"error": "Structural parameter drift limit breached. Connection insulated."}';
    }
}
# ========================================================================
