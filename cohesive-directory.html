<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWEO Global - In-House Cohesive Talent Directory</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #b573ff; /* Ultraviolet Theme */
            border-bottom: 2px solid #9146ff;
            padding-bottom: 15px;
            font-weight: 600;
        }
        .subtitle {
            color: #a9a9b3;
            margin-bottom: 30px;
        }
        .grid-header {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr 1fr;
            background-color: #1a1a1e;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            border: 1px solid #29292e;
            color: #fff;
        }
        .talent-list {
            background-color: #1a1a1e;
            border: 1px solid #29292e;
            border-top: none;
            border-radius: 0 0 8px 8px;
        }
        .talent-row {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr 1fr;
            padding: 15px;
            border-bottom: 1px solid #29292e;
            align-items: center;
        }
        .talent-row:last-child {
            border-bottom: none;
        }
        .username {
            color: #b573ff;
            font-weight: bold;
            text-decoration: none;
        }
        .username:hover {
            text-decoration: underline;
        }
        .badge {
            background-color: #2e1b4e;
            color: #d6b3ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            text-align: center;
            border: 1px solid #9146ff;
            width: fit-content;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟣 ICIT Ultraviolet Directory</h1>
        <p class="subtitle">Verified In-House Cohesive Engineers & Mathematicians aligned with foundational core frameworks.</p>
        
        <div class="grid-header">
            <div>GitHub Operator Signature</div>
            <div>Calibration Date</div>
            <div>Unified Score</div>
            <div>GRID Basin</div>
        </div>
        
        <div class="talent-list" id="cohesive-anchor-zone">
            <!-- APPLICANT TELEMETRY ROWS AUTOMATICALLY APPEND BELOW THIS LINE -->
            <!-- COHESIVE_MARKER -->
        </div>
    </div>
</body>
</html>
